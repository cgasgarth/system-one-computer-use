[project]
name = "system-one-julia-cpu"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.14.0",
  "transformers==5.0.0",
  "safetensors>=0.5",
  "numpy>=1.26",
  "huggingface-hub>=0.35",
  "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/julia_runtime"]
